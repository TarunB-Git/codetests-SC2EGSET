name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e62734a5c26f53650d5eae3d6f66e7c60c
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen --extra cpu --group dev
      - run: uv run ruff check .
      - run: uv run mypy src/latent_trainer/benchmarks src/latent_trainer/models/lightning/lit_guided_vae.py
      - run: uv run pytest -q
      - run: uv build
