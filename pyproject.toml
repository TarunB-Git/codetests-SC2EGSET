[project]
name = "latent-trainer"
version = "0.1.0"
description = "Leakage-resistant StarCraft II replay benchmarks and representation learning"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "click>=8.3.0",
    "lightning==2.6.1",
    "matplotlib>=3.10.7",
    "mlflow>=3.9.0",
    "numpy>=2.4.2",
    "optuna>=4.5.0",
    "optuna-dashboard>=0.19.0",
    "optuna-integration[pytorch-lightning]>=4.5.0",
    "plotly>=6.3.1",
    "plotpy>=2.7.5",
    "pot>=0.9.6.post1",
    "ray[tune]>=2.54.0",
    "sc2-datasets",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "umap-learn>=0.5.12",
    "shap>=0.51.0",
    "xgboost>=3.2.0",
]

[project.scripts]
sc2-benchmarks = "latent_trainer.benchmarks.cli:main"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings>=1.0.3",
    "mkdocstrings-python>=2.0.2",
    "ruff>=0.15.0",
    "mkdocs-material>=9.7.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.4",
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "commitizen>=4.13.7",
    "snakeviz>=2.2.2",
]

[project.optional-dependencies]
# Dependencies for the CPU build (installed with uv sync --extra cpu)
cpu = ["torch>=2.7.0", "torchvision>=0.22.0"]

# Dependencies for the CUDA build (installed with uv sync --extra cuda)
cuda = ["torch>=2.7.0", "torchvision>=0.22.0"]

# uv-specific configuration:
[tool.uv]
# This prevents installing both CPU and CUDA builds simultaneously
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.ruff]
exclude = [".venv"]
line-length = 88
extend-exclude = ["src/sc2_combat_detector/proto", "src/proto"]
lint.extend-select = ["I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true


[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
sc2-datasets = { git = "https://github.com/Kaszanas/SC2_Datasets", rev = "3f3ee3a48a48f2d47c0d62930d79ca465113816a" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]


# Index Definitions:
# ... PyTorch index definitions ...
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
